[package]
name = "rice-desktop"
version = "1.0.0"
description = "Nigeria Life Intelligence Engine — desktop shell (Tauri 2)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "rice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rice-desktop"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
